name: Nabd embed diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/nabd-embed-diagnostic.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps
      - name: Capture error source and actual widget display
        shell: python
        run: |
          import json,pathlib,time
          from playwright.sync_api import sync_playwright
          report={'errors':[],'console_errors':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch(args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1100},locale='ar')
              page.on('pageerror',lambda e:report['errors'].append({'message':str(e),'stack':e.stack}))
              page.on('console',lambda m:report['console_errors'].append({'text':m.text,'location':m.location}) if m.type=='error' else None)
              page.goto('https://ammarabushahin.github.io/fagersta-khutbah/nabd/?v=2.1',wait_until='domcontentloaded')
              frame=page.frame_locator('#content')
              frame.locator('.x-embedded-card').first.wait_for(timeout=90000)
              doc=next(f for f in page.frames if '/nabd/wall.html' in f.url)
              doc.wait_for_function('typeof NabdXEmbeds!=="undefined"&&!busy',timeout=90000)
              doc.evaluate('state.settings.auto=false;v2Status();')
              frame.locator('.x-embedded-card').first.scroll_into_view_if_needed()
              page.wait_for_timeout(15000)
              report['embed_status']=doc.evaluate('NabdXEmbeds.stats()')
              page.screenshot(path='nabd/embed-diagnostic-desktop.png',animations='disabled')
              page.set_viewport_size({'width':390,'height':844})
              page.wait_for_timeout(2000)
              page.screenshot(path='nabd/embed-diagnostic-mobile.png',animations='disabled')
              browser.close()
          pathlib.Path('nabd/embed-diagnostic.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabd-embed-diagnostic
          path: nabd/embed-diagnostic*
          retention-days: 3
      - name: Record diagnostic only
        run: |
          git config user.name 'Nabd wall bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nabd/embed-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record official widget diagnostic [skip ci]'
            git pull --rebase origin main
            git push
          fi
