name: Nabd Studio 3 · isolated publish and verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nabd/studio-src/**'
      - '.github/workflows/nabd-wall.yml'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: nabd-wall-cache
  cancel-in-progress: false
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Import the reviewed public code release once, never the private workbook
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, urllib.request
          root = pathlib.Path('nabd')
          target = root / 'studio-src'
          if not (target / 'src/studio.js').exists():
              # This short-lived URL contains only the public application source bundle.
              # It does not grant access to the user's private source workbook or credentials.
              url = 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-5ad8-8210-bc3a-cee93000f1d7/raw?se=2026-10-03T10%3A02%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=06019cc6-1a32-54cb-8596-c53aaea6a60e&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T03%3A57%3A04Z&ske=2026-10-04T03%3A57%3A04Z&sks=b&skv=2026-02-06&sig=6fKwPZ%2BwxbfvufZWMmbQSKJh19VRgTyikOslgHmAk70%3D'
              with urllib.request.urlopen(url, timeout=40) as r:
                  encoded = r.read(200000)
              raw = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=268435456)
              assert len(raw) == 192683
              assert hashlib.sha256(raw).hexdigest() == '187c2f9ec21f13dd4cd91c7bdd53357211ed6cdd39d0f745ac7347269ede07f8'
              files = json.loads(raw)
              allowed = {'build.py','seed.py','README-ar.md','src/studio.html','src/studio.css','src/studio.js','src/config.json','src/shell.html','tests/test_studio.py','tests/verify_live.py','privacy-check.json'}
              assert set(files) == allowed
              for name, content in files.items():
                  assert isinstance(content, str)
                  path = target / name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content, encoding='utf-8')
              print('Reviewed public source imported and checksum verified.')
          else:
              print('Using version-controlled public source; no external download needed.')
      - name: Retain source before building, without replacing the working app
        run: |
          git config user.name 'Nabd wall bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nabd/studio-src/
          if ! git diff --cached --quiet; then
            git commit -m 'Retain reviewed Studio public sources; exclude private workbook [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Build Studio without altering unrelated site files
        if: github.event_name != 'schedule'
        run: |
          python nabd/studio-src/build.py nabd
          node --check nabd/studio-src/src/studio.js
      - name: Install isolated browser testing tools
        if: github.event_name != 'schedule'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps
      - name: Test administration, embeds, backups, and persistent display using fixtures
        if: github.event_name != 'schedule'
        run: python nabd/studio-src/tests/test_studio.py nabd
      - name: Refresh only public X fallback data
        run: python nabd/studio-src/seed.py nabd
      - name: Publish the passing release and public cache
        run: |
          git add nabd/seed-studio.json nabd/studio-source-check.json
          if [ '${{ github.event_name }}' != 'schedule' ]; then
            git add nabd/index.html nabd/studio.html nabd/robots.txt nabd/build-studio.json nabd/studio-local-tests.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Nabd Studio and public source cache [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Verify the real public page, live source responses, and mobile layout
        if: github.event_name != 'schedule'
        run: python nabd/studio-src/tests/verify_live.py nabd
      - name: Retain diagnostics and browser screenshots
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: nabd-studio-verification
          path: |
            nabd/studio-local-tests.json
            nabd/studio-local-*.png
            nabd/studio-verification.json
            nabd/studio-live-*.png
            nabd/studio-source-check.json
          retention-days: 7
      - name: Record diagnostics only, even when tests fail
        if: always() && github.event_name != 'schedule'
        run: |
          for file in nabd/studio-local-tests.json nabd/studio-verification.json nabd/studio-source-check.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record Studio verification without claiming platform view increases [skip ci]'
            git push
          fi
