name: Nabd 2.1 · official X embeds and verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nabd/v2-release/**'
      - 'nabd/embed-release/**'
      - '.github/workflows/nabd-wall.yml'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: nabd-wall-cache
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Decode checksum-verified public sources only
        if: github.event_name != 'schedule'
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib
          root = pathlib.Path('nabd')
          encoded = ''.join((root / 'v2-release' / ('part' + str(i) + '.b64')).read_text().strip() for i in range(1,6))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=268435456)
          assert len(raw) < 500000
          assert hashlib.sha256(raw).hexdigest() == 'd95589bfa13a16dae980308fba8bae9def9866d7fb4630abcd0f14f0b845677a', 'Source integrity check failed'
          files = json.loads(raw)
          allowed = {'verify_live.py','upgrade.css','members.json','build.py','test_ui.py','shell.html','upgrade.js','auth.json','probe.py'}
          assert set(files) == allowed
          old = "page.locator('#start-screen').click()\n  check"
          new = "page.locator('#start-screen').click()\n  page.wait_for_function('!!document.fullscreenElement',timeout=10000)\n  check"
          assert files['test_ui.py'].count(old) == 1
          files['test_ui.py'] = files['test_ui.py'].replace(old,new)
          old = " ctx.route('https://fonts.googleapis.com/**',lambda r:r.abort())"
          new = " ctx.route('https://platform.twitter.com/**',lambda r:r.abort())\n" + old
          assert files['test_ui.py'].count(old) == 1
          files['test_ui.py'] = files['test_ui.py'].replace(old,new)
          target = root / 'v2-src'
          target.mkdir(exist_ok=True)
          for name, content in files.items():
              assert isinstance(content, str)
              (target / name).write_text(content, encoding='utf-8')
          encoded = ''.join((root / 'embed-release' / ('part' + str(i) + '.b64')).read_text().strip() for i in range(1,3))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=268435456)
          assert len(raw) == 34934
          assert hashlib.sha256(raw).hexdigest() == '62cc70470b6ab9b22239e6603743ae2c7198d631154b13e77221947cc8c7ff19', 'Embed source integrity check failed'
          files = json.loads(raw)
          assert set(files) == {'build.py','embeds.js','embeds.css','test_embed.py','verify_live.py'}
          target = root / 'embed-src'
          target.mkdir(exist_ok=True)
          for name, content in files.items():
              assert isinstance(content, str)
              (target / name).write_text(content, encoding='utf-8')
          print('Allowlisted public sources verified. No private account document or plaintext deployed password is used in CI.')
      - name: Build isolated app with official X embeds
        if: github.event_name != 'schedule'
        run: |
          python nabd/v2-src/build.py nabd
          python nabd/embed-src/build.py nabd
      - name: Install browser testing tools
        if: github.event_name != 'schedule'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps
      - name: Test official embed integration using offline fixtures
        if: github.event_name != 'schedule'
        run: python nabd/embed-src/test_embed.py nabd
      - name: Test existing display and security controls with separate test-only password
        id: ui
        if: github.event_name != 'schedule'
        run: python nabd/v2-src/test_ui.py nabd
      - name: Publish only the tested Nabd app
        if: github.event_name != 'schedule'
        run: |
          git config user.name 'Nabd wall bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nabd/index.html nabd/wall.html nabd/build-v2.json nabd/build-embed.json nabd/v2-src/ nabd/embed-src/ nabd/local-tests.json nabd/embed-local-tests.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish official X embeds with unchanged public accounts and local edit protection [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Check public sources without account authentication
        if: always()
        run: test ! -f nabd/v2-src/probe.py || python nabd/v2-src/probe.py
      - name: Verify genuine official embeds on the public deployment
        if: github.event_name != 'schedule' && success()
        run: python nabd/embed-src/verify_live.py
      - name: Retain test reports and screenshots
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: nabd-embed-verification
          path: |
            nabd/local-tests.json
            nabd/local-*.png
            nabd/embed-local-tests.json
            nabd/embed-local-*.png
            nabd/embed-verification.json
            nabd/embed-live-*.png
            nabd/provider-check-v2.json
          retention-days: 7
      - name: Record diagnostics without changing the unrelated root site
        if: always()
        run: |
          git config user.name 'Nabd wall bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in nabd/local-tests.json nabd/embed-local-tests.json nabd/embed-verification.json nabd/provider-check-v2.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record official embed verification; no view-count increases claimed [skip ci]'
            git push
          fi
