name: Nabd wall · publish and feed cache
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nabd/release/**'
      - 'nabd/verify.py'
      - '.github/workflows/nabd-wall.yml'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: nabd-wall-cache
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Publish exact tested app and fetch public timeline
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import base64, datetime, hashlib, json, lzma, os, pathlib, urllib.request
          root = pathlib.Path('nabd')
          root.mkdir(exist_ok=True)
          if os.environ['EVENT_NAME'] != 'schedule' or not (root / 'index.html').exists():
              parts = [root / 'release' / ('part' + str(i) + '.b64') for i in range(1, 6)]
              encoded = ''.join(part.read_text().strip() for part in parts)
              html = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=268435456)
              if hashlib.sha256(html).hexdigest() != 'd0f14cc571f012c60b145dfe70a48b13c2dc83956be2008d9c0bb966cf740c7b':
                  raise ValueError('Base release integrity check failed')
              old = b'feed.appendChild(el);'
              new = b'const anchor=feed.children[ar.indexOf(p)];if(anchor!==el)feed.insertBefore(el,anchor||null);'
              assert html.count(old) == 1
              html = html.replace(old, new)
              actual = hashlib.sha256(html).hexdigest()
              if len(html) != 97501 or actual != '7df9d57cd35206e2351ab0e2b36f3d7afa2bf88abcf6e47a84b22495e53d445e':
                  raise ValueError('Final release integrity check failed: ' + actual)
              (root / 'index.html').write_bytes(html)
              print('Verified final standalone HTML release:', actual)
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          report = {'checked_at': now, 'account': 'SalmaRashwani', 'provider': 'FxEmbed public API v2'}
          try:
              request = urllib.request.Request('https://api.fxtwitter.com/2/profile/SalmaRashwani/statuses?count=50', headers={'Accept': 'application/json', 'User-Agent': 'NabdPublicWall/1.0', 'Origin': 'https://ammarabushahin.github.io'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
                  report['http_status'] = response.status
                  report['cors'] = response.headers.get('Access-Control-Allow-Origin')
              if data.get('code') != 200 or not isinstance(data.get('results'), list):
                  raise ValueError('Provider did not return a valid timeline: ' + str(data.get('message', data.get('code'))))
              report['ok'] = True
              report['count'] = len(data['results'])
              seed = {'fetched_at': now, 'account': 'SalmaRashwani', 'provider': 'FxEmbed public API v2', 'data': data}
              (root / 'seed.json').write_text(json.dumps(seed, ensure_ascii=False), encoding='utf-8')
              print('Timeline retrieved:', report['count'], 'posts; CORS:', report['cors'])
          except Exception as error:
              report['ok'] = False
              report['error'] = str(error)
              print('Public timeline unavailable:', error)
          report['html_sha256'] = hashlib.sha256((root / 'index.html').read_bytes()).hexdigest()
          (root / 'health.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
      - name: Commit only the isolated app and cache
        run: |
          git config user.name 'Nabd wall bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nabd/index.html nabd/health.json
          test ! -f nabd/seed.json || git add nabd/seed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish tested Nabd app and refresh public feed [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Install browser testing tools for this release
        if: github.event_name != 'schedule'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps
      - name: Verify public URL and real browser interactions
        if: github.event_name != 'schedule'
        run: python nabd/verify.py
      - name: Retain public verification and screenshots
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: nabd-live-verification
          path: |
            nabd/verification.json
            nabd/live-*.png
          retention-days: 7
      - name: Record verification result without modifying the existing site
        if: always() && github.event_name != 'schedule'
        run: |
          if [ -f nabd/verification.json ]; then
            git add nabd/verification.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record Nabd public deployment verification [skip ci]'
              git pull --rebase origin main
              git push
            fi
          fi
