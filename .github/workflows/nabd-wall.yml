name: Nabd 2 · isolated publish and verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nabd/v2-release/**'
      - '.github/workflows/nabd-wall.yml'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: nabd-wall-cache
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Decode checksum-verified public sources only
        if: github.event_name != 'schedule'
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib
          root = pathlib.Path('nabd')
          encoded = ''.join((root / 'v2-release' / ('part' + str(i) + '.b64')).read_text().strip() for i in range(1,6))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=268435456)
          assert len(raw) < 500000
          assert hashlib.sha256(raw).hexdigest() == 'd95589bfa13a16dae980308fba8bae9def9866d7fb4630abcd0f14f0b845677a', 'Source integrity check failed'
          files = json.loads(raw)
          allowed = {'verify_live.py','upgrade.css','members.json','build.py','test_ui.py','shell.html','upgrade.js','auth.json','probe.py'}
          assert set(files) == allowed
          old = "page.locator('#start-screen').click()\n  check"
          new = "page.locator('#start-screen').click()\n  page.wait_for_function('!!document.fullscreenElement',timeout=10000)\n  check"
          assert files['test_ui.py'].count(old) == 1
          files['test_ui.py'] = files['test_ui.py'].replace(old,new)
          target = root / 'v2-src'
          target.mkdir(exist_ok=True)
          for name, content in files.items():
              assert isinstance(content, str)
              (target / name).write_text(content, encoding='utf-8')
          print('Nine allowlisted public source files verified. No private source document is used in CI.')
      - name: Build the isolated app
        if: github.event_name != 'schedule'
        run: python nabd/v2-src/build.py nabd
      - name: Install browser testing tools
        if: github.event_name != 'schedule'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps
      - name: Test controls using isolated local fixtures and a separate test-only password
        id: ui
        if: github.event_name != 'schedule'
        run: python nabd/v2-src/test_ui.py nabd
      - name: Publish only the tested Nabd app
        if: github.event_name != 'schedule'
        run: |
          git config user.name 'Nabd wall bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nabd/index.html nabd/wall.html nabd/build-v2.json nabd/v2-src/ nabd/local-tests.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Nabd 2 app without private account credentials [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Check public sources without account authentication
        if: always()
        run: test ! -f nabd/v2-src/probe.py || python nabd/v2-src/probe.py
      - name: Verify the real public deployment
        if: github.event_name != 'schedule' && success()
        run: python nabd/v2-src/verify_live.py
      - name: Inspect public Facebook post discovery without signing in
        if: always() && github.event_name != 'schedule'
        shell: python
        run: |
          import html, json, pathlib, re, urllib.request
          report = {'authenticated': False, 'checks': []}
          for handle in ['SalmaRashwani', 'QamarAlbarodi']:
              item = {'handle': handle}
              try:
                  request = urllib.request.Request('https://www.facebook.com/' + handle, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      text = html.unescape(response.read(3000000).decode('utf-8', 'replace').replace('\\/', '/'))
                      item['http_status'] = response.status
                  title = re.search(r'<title[^>]*>(.*?)</title>', text, re.S)
                  item['page_title'] = re.sub('<[^>]+>', '', title.group(1))[:160] if title else None
                  links = re.findall(r'https://(?:www\.)?facebook\.com/[A-Za-z0-9_.-]+/(?:posts|videos|reel)/[A-Za-z0-9]+', text)
                  item['public_post_links'] = sorted(set(links))[:20]
                  item['public_post_link_count'] = len(set(links))
              except Exception as error:
                  item['error_type'] = type(error).__name__
              report['checks'].append(item)
          pathlib.Path('nabd/facebook-discovery-check.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False, indent=2))
      - name: Retain test reports and screenshots
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: nabd-v2-verification
          path: |
            nabd/local-tests.json
            nabd/local-*.png
            nabd/verification-v2.json
            nabd/live-v2-*.png
            nabd/provider-check-v2.json
            nabd/facebook-discovery-check.json
          retention-days: 7
      - name: Record diagnostics without changing the unrelated root site
        if: always()
        run: |
          git config user.name 'Nabd wall bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in nabd/local-tests.json nabd/verification-v2.json nabd/provider-check-v2.json nabd/facebook-discovery-check.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record Nabd 2 verification diagnostics [skip ci]'
            git push
          fi
